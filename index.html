<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Prayers Registration Portal | Sri Subramaniar Alayam</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon:#711821;--maroon-d:#521118;--saffron:#c99a3e;--cream:#faf4e8;--ink:#2b1d14;--line:#ead9bd}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
       background:linear-gradient(160deg,var(--cream),#f2e8d6);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;width:100%;max-width:430px;border-radius:16px;box-shadow:0 10px 30px rgba(90,20,20,.15);overflow:hidden}
  .head{background:linear-gradient(180deg,rgba(38,7,11,.6),rgba(38,7,11,.94)),url(hero.jpg) center/cover;color:#fff;text-align:center;padding:26px 20px;border-bottom:3px solid var(--saffron)}
  .head img{display:block;margin:0 auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
  .head h1{margin:8px 0 2px;font-size:20px;font-weight:700;font-family:Cinzel,Georgia,serif;letter-spacing:.04em}
  .head p{margin:0;font-size:13px;opacity:.85}
  .body{padding:22px}
  .opt{display:block;text-decoration:none;color:inherit;border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;transition:.15s}
  .opt:hover{border-color:var(--saffron);box-shadow:0 4px 14px rgba(201,154,62,.25)}
  .opt b{display:block;font-size:16px;color:var(--maroon);margin-bottom:3px}
  .opt span{font-size:13px;color:#7b6a58}
  .opt.admin{background:#faf4e8}
</style>
</head>
<body>
<script>if(location.pathname.replace(/\/+$/,"")==="/groupprayers"&&!location.pathname.endsWith("/"))location.replace("/groupprayers/"+location.search);</script>
<div class="card">
  <div class="head">
    <img src="logo.png" alt="Sri Subramaniar Alayam logo" width="84" height="84">
    <h1>Group Prayers Registration Portal</h1>
    <p>Sri Subramaniar Alayam, Lok Kawi</p>
  </div>
  <div class="body">
    <a class="opt" href="portal.html"><b>Member portal</b><span>Register, log in, join prayer groups and upload payment proof.</span></a>
    <a class="opt admin" href="admin.html"><b>Committee sign-in</b><span>For temple committee members only.</span></a>
  </div>
</div>
</body>
</html>
