<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Committee Panel | Sri Subramaniar Alayam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1e6;--surface:#fffdf8;--fg:#2b1b12;--muted:#6b5648;--line:#e6d9c2;--line-soft:#f0e7d6;
  --maroon-950:#26070b;--maroon-800:#521118;--maroon-700:#711821;
  --btn:#711821;--accent:#711821;--gold:#c99a3e;--gold-300:#e8ce8e;--gold-100:#f6e9c8;--gold-soft:#fbf1d9;
  --ok:#1b6e37;--ok-soft:#e0f2e6;--warn:#8a5600;--warn-soft:#fbefd2;--bad:#a8241c;--bad-soft:#fbe4e1;
  --shadow:0 8px 24px rgba(38,7,11,.10);--shadow-pop:0 18px 44px rgba(38,7,11,.24);
  --display:'Cinzel',Georgia,serif;--body:'Manrope',system-ui,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.55 var(--body);min-height:100vh}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
svg{flex:none}

.btn{background:var(--btn);color:#fff;border:0;border-radius:11px;padding:10px 18px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
.btn.ok{background:var(--ok)}
.btn.bad{background:none;color:var(--bad);border:1.5px solid var(--bad);box-shadow:none}
.btn.sm{padding:6px 13px;font-size:14px;border-radius:9px}
.btn.full{width:100%;margin-top:18px;padding:13px;font-size:16.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:2px;font-size:14px;font-weight:600}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 5px}
input,textarea,select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:var(--btn);flex:none}
.hint{font-size:13px;color:var(--muted);margin:5px 0 0}
.meta{color:var(--muted);font-size:13.5px}
.sub{color:var(--muted);margin:3px 0 16px}
.empty{text-align:center;color:var(--muted);padding:22px 0}
.msg{margin-top:14px;padding:10px 12px;border-radius:9px;font-size:14.5px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:99px;padding:2px 11px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.verified,.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:5px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--btn);color:var(--accent);background:var(--gold-soft)}
.tagline{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 7px;margin:3px 4px 0 0;color:var(--muted)}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--gold);color:var(--maroon-950);font-size:12px;font-weight:800;line-height:20px;text-align:center}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:0;cursor:pointer}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.tb{font-size:12px;font-weight:800;border-radius:6px;padding:1px 9px;white-space:nowrap}
.tb.monthly{background:var(--gold-soft);color:var(--accent);border:1px solid var(--gold)}
.tb.special{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.tb.annual{background:var(--maroon-700);color:#fff;border:1px solid var(--maroon-700)}
.evtag{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:3px;font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);min-width:0}
.panel + .panel{margin-top:18px}
h2{font-size:20px;font-family:var(--display);font-weight:600;letter-spacing:.02em}
h3.sec{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:26px 0 10px}
.rows{border-top:1px solid var(--line-soft)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.row .grow{flex:1 1 220px;min-width:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mono{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--gold-100);background:linear-gradient(145deg,var(--maroon-700),var(--maroon-950));box-shadow:inset 0 0 0 2px var(--gold)}
.stat{padding:11px 14px;background:var(--gold-soft);border-radius:10px;margin-bottom:14px;font-size:15px}

/* sign-in */
.hero{background:linear-gradient(180deg,rgba(38,7,11,.55),rgba(38,7,11,.94)),url(hero.jpg) center 28%/cover;color:var(--gold-100);text-align:center;padding:34px 16px 96px}
.hero img{width:92px;height:92px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.hero .brand{font-family:var(--display);font-size:26px;color:#fff;margin-top:6px;letter-spacing:.05em}
.hero .sub2{color:var(--gold-300);font-weight:600;margin-top:4px}
.auth{max-width:440px;margin:-66px auto 0;position:relative;border-top:3px solid var(--gold);box-shadow:var(--shadow-pop);padding:24px;background:var(--surface);border-radius:16px}
.auth-wrap{padding:0 16px 40px}
.codein{letter-spacing:8px;text-align:center;font-size:24px;font-weight:800}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);max-width:1240px;margin:0 auto;min-height:100vh}
.rail{background:linear-gradient(180deg,#26070b,#3b0f15);color:var(--gold-100);padding:22px 14px;display:flex;flex-direction:column;gap:18px;border-right:3px solid var(--gold)}
.rail .id{display:flex;align-items:center;gap:10px;padding:0 6px}
.rail .id img{width:50px;height:50px}
.rail .brand{font-family:var(--display);font-weight:600;font-size:17px;color:#fff;letter-spacing:.05em;line-height:1.15}
.rail small{display:block;color:var(--gold-300);font-size:12px;font-weight:600;line-height:1.3}
.rail nav{display:flex;flex-direction:column;gap:3px}
.rail nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;background:none;border:0;color:inherit;font-weight:700;cursor:pointer;opacity:.82}
.rail nav button:hover{background:rgba(232,206,142,.08);opacity:1}
.rail nav button.on{background:rgba(232,206,142,.16);opacity:1;box-shadow:inset 3px 0 0 var(--gold)}
.rail nav .count{margin-left:auto}
.rail .me{margin-top:auto;padding:12px;border:1px solid rgba(232,206,142,.3);border-radius:12px;font-size:13px}
.rail .me b{display:block;color:#fff}
.rail .me .out{margin-top:10px;width:100%;background:transparent;border:1.5px solid rgba(232,206,142,.5);color:var(--gold-100);border-radius:9px;padding:6px;font-weight:700;cursor:pointer}
.main{padding:24px 28px 56px;min-width:0}
.crumb{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;font-size:13.5px;color:var(--muted);font-weight:600}
.crumb b{color:var(--accent);font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.tile .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--gold-soft);color:var(--accent)}
.tile .n{font-size:27px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13.5px;color:var(--muted)}
.tile.alert{border-color:var(--gold);background:linear-gradient(0deg,var(--gold-soft),var(--surface))}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.feein{width:96px;padding:6px 8px}
.bar{display:flex;height:9px;border-radius:99px;background:var(--line-soft);overflow:hidden;min-width:110px;margin-top:6px}
.bar .bv{background:var(--ok)} .bar .bp{background:var(--gold)}
@media (max-width:859px){
  .shell{display:block}
  .rail{border-right:0;border-bottom:3px solid var(--gold);padding:12px 16px;gap:10px}
  .rail nav{flex-direction:row;overflow-x:auto;gap:6px}
  .rail nav button{width:auto;white-space:nowrap;padding:8px 12px}
  .rail .me{margin-top:0}
  .main{padding:20px 16px 48px}
}
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .scrim{position:absolute;inset:0;background:rgba(13,8,9,.62)}
#modal .sheet{position:relative;background:var(--surface);border-radius:18px;border-top:3px solid var(--gold);padding:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto;box-shadow:var(--shadow-pop)}
#modal .sheet h2{margin-bottom:12px}
#modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:11px 18px;border-radius:10px;color:#fff;font-weight:600;z-index:120;max-width:92%;text-align:center;background:var(--ok);box-shadow:var(--shadow-pop)}
#toast.err{background:var(--bad)}
</style>
</head>
<body>
<div id="app"><div class="auth-wrap" style="padding-top:80px;text-align:center;color:#6b5648">Loading…</div></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var cfg = window.PORTAL_CONFIG;
  var TEMPLE = cfg.TEMPLE_NAME;
  var sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var TYPES = { monthly: 'Monthly pooja', special: 'Special pooja', annual: 'Grand annual pooja' };
  var ICONS = {
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    layers: '<path d="m12 2 10 5-10 5L2 7l10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    bank: '<path d="M3 22h18"/><path d="M6 18v-7M10 18v-7M14 18v-7M18 18v-7"/><path d="M12 2 3 8v3h18V8Z"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    rupee: '<path d="M4 6h16M4 11h16M8 6c6 0 8 3 8 5s-2 5-8 5l7 5"/>'
  };

  /* ---------- helpers ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else if (c.nodeType) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
  function h(tag, props) {
    var el = document.createElement(tag), after = {};
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'value' || k === 'checked') after[k] = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    if ('value' in after) el.value = after.value;
    if ('checked' in after) el.checked = !!after.checked;
    return el;
  }
  function icon(name, size) {
    var s = size || 20, span = document.createElement('span');
    span.style.display = 'inline-flex'; span.setAttribute('aria-hidden', 'true');
    span.innerHTML = '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';
    return span;
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtDate(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0]; }
  function rm(n) { return 'RM ' + Number(n).toFixed(2); }
  function pill(status, label) { return h('span', { class: 'pill ' + status, text: label || status.charAt(0).toUpperCase() + status.slice(1) }); }
  function evTag(ev) {
    return h('div', { class: 'evtag' }, h('span', { class: 'tb ' + ev.event_type, text: TYPES[ev.event_type] }),
      h('strong', { text: ev.event_date ? fmtDate(ev.event_date) : 'Date to be announced' }));
  }
  var toastTimer;
  function toast(text, bad) {
    var t = $('#toast'); t.textContent = text; t.className = bad ? 'err' : ''; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3800);
  }
  function closeModal() { $('#modal').hidden = true; $('#modal').textContent = ''; }
  function openModal(title, content, buttons) {
    var m = $('#modal'); m.textContent = '';
    m.appendChild(h('div', { class: 'scrim', onclick: closeModal }));
    m.appendChild(h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      h('h2', { text: title }), content,
      h('div', { class: 'actions' }, buttons || [h('button', { class: 'btn', type: 'button', text: 'Close', onclick: closeModal })])));
    m.hidden = false;
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  function errText(e) { return (e && e.message) ? e.message : 'Something went wrong. Please try again.'; }

  /* ---------- state ---------- */
  var me = null;           // { id, name, email, role }
  var D = null;            // loaded data
  var ui = { tab: 'overview', df: 'pending', dq: '', open: null };
  var authView = { screen: 'login', email: '', msg: null };

  function can() { return me && me.role === 'owner'; }
  function dev(id) { return D.devotees.filter(function (x) { return x.id === id; })[0]; }
  function grp(id) { return D.groups.filter(function (x) { return x.id === id; })[0]; }
  function membersOf(gid) { return D.memberships.filter(function (m) { return m.group_id === gid; }).map(function (m) { return dev(m.devotee_id); }).filter(Boolean); }
  function groupsOf(did) { return D.memberships.filter(function (m) { return m.devotee_id === did; }).map(function (m) { return grp(m.group_id); }).filter(Boolean); }
  function count(list, fn) { return list.filter(fn).length; }

  async function logIt(text) {
    try { await sb.from('activity_log').insert({ admin_id: me.id, admin_name: me.name, action: text }); } catch (e) { /* log is best effort */ }
  }

  async function loadData() {
    var r = await Promise.all([
      sb.from('devotees').select('*').order('created_at', { ascending: false }),
      sb.from('groups').select('*').order('created_at'),
      sb.from('memberships').select('*'),
      sb.from('prayer_events').select('*').order('event_date'),
      sb.from('payments').select('id,devotee_id,event_id,amount,status'),
      sb.from('temple_settings').select('*').eq('id', 1).maybeSingle()
    ]);
    for (var i = 0; i < r.length; i++) { if (r[i].error) throw r[i].error; }
    D = { devotees: r[0].data, groups: r[1].data, memberships: r[2].data, events: r[3].data, payments: r[4].data, settings: r[5].data || {} };
  }

  /* run a database change, then refresh */
  async function act(promise, okText) {
    try {
      var res = await promise;
      if (res && res.error) throw res.error;
      if (okText) toast(okText);
      await loadData(); render();
      return true;
    } catch (e) { toast(errText(e), true); return false; }
  }

  /* =====================================================
     SIGN IN (email + password), with first-time / forgot flow
     ===================================================== */
  function passwordProblem(p) {
    if (p.length < 12) return 'Please use at least 12 characters.';
    if (!/[A-Za-z]/.test(p) || !/\d/.test(p)) return 'Please include both letters and numbers.';
    if (/^(.)\1+$/.test(p)) return 'That password is too simple.';
    return null;
  }
  function authMsg() { var m = authView.msg; authView.msg = null; return m ? h('div', { class: 'msg ' + (m.ok ? 'ok' : 'err'), role: 'status', text: m.text }) : null; }
  function say(text, ok) { authView.msg = { text: text, ok: !!ok }; }

  function authShell(body) {
    return h('div', null,
      h('div', { class: 'hero' }, h('img', { src: 'logo.png', alt: 'Temple logo', width: 92, height: 92 }),
        h('div', { class: 'brand', text: 'Committee Panel' }), h('div', { class: 'sub2', text: TEMPLE })),
      h('div', { class: 'auth-wrap' }, h('div', { class: 'auth' }, body)));
  }

  function loginScreen() {
    var s = authView.screen, body;
    if (s === 'reset1') {
      body = h('form', { onsubmit: async function (e) {
          e.preventDefault();
          var email = $('#a-email').value.trim().toLowerCase();
          var btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
          var r = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false } });
          btn.disabled = false;
          if (r.error) { say('Could not send a code. ' + r.error.message); return render(); }
          authView.email = email; authView.screen = 'reset2'; say('Code sent. Please check your inbox (and spam folder).', true); render();
        } },
        h('h2', { text: 'First time or forgot password' }),
        h('p', { class: 'sub', text: 'We will email you a code, then you can set a new password.' }),
        h('label', { for: 'a-email', text: 'Committee email address' }),
        h('input', { id: 'a-email', type: 'email', required: true, value: authView.email, autocomplete: 'email' }),
        h('button', { class: 'btn full', type: 'submit', text: 'Send me a code' }), authMsg(),
        h('p', { class: 'hint', style: 'text-align:center;margin-top:14px' }, h('button', { type: 'button', class: 'link', text: 'Back to sign in', onclick: function () { authView.screen = 'login'; render(); } })));
    } else if (s === 'reset2') {
      body = h('form', { onsubmit: async function (e) {
          e.preventDefault();
          var token = $('#a-code').value.replace(/\s/g, '');
          var btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
          var r = await sb.auth.verifyOtp({ email: authView.email, token: token, type: 'email' });
          btn.disabled = false;
          if (r.error) { say('That code is incorrect or has expired.'); return render(); }
          authView.screen = 'reset3'; render();
        } },
        h('h2', { text: 'Enter the code' }),
        h('p', { class: 'sub' }, 'We sent a code to ', h('strong', { text: authView.email }), '.'),
        h('input', { id: 'a-code', class: 'codein', type: 'text', inputmode: 'numeric', maxlength: 8, required: true, autocomplete: 'one-time-code', 'aria-label': 'Code' }),
        h('button', { class: 'btn full', type: 'submit', text: 'Verify' }), authMsg(),
        h('p', { class: 'hint', style: 'text-align:center;margin-top:14px' }, h('button', { type: 'button', class: 'link', text: 'Back to sign in', onclick: function () { authView.screen = 'login'; render(); } })));
    } else if (s === 'reset3') {
      body = h('form', { onsubmit: async function (e) {
          e.preventDefault();
          var p1 = $('#a-p1').value, p2 = $('#a-p2').value;
          var bad = passwordProblem(p1);
          if (bad) { say(bad); return render(); }
